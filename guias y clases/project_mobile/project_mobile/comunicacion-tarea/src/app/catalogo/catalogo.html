<main class="container py-4">

  <header class="text-center mb-4">
    <h1>Selector de productos</h1>

    <p class="lead">
      Selecciona un producto para ver el resumen de compra.
    </p>
  </header>

  <section class="row g-4">

    @for (producto of productos(); track producto.nombre) {

      <div class="col-md-4">

        <app-tarjeta-producto
          [producto]="producto"
          (seleccionado)="seleccionarProducto($event)"
        />

      </div>

    }

  </section>

  <section class="mt-5">

    <app-resumen-compra [producto]="productoSeleccionado()"[(cantidad)]="cantidad"/>

  </section>

</main>
