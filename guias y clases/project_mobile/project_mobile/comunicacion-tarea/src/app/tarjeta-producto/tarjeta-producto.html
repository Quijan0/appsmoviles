<article class="card h-100 shadow-sm">
  <section class="card-body text-center">

    <h2 class="card-title">
      {{ producto().nombre }}
    </h2>

    <p class="card-text">
      Precio:
      <strong>${{ producto().precio }}</strong>
    </p>

    <button
      type="button"
      class="btn btn-primary"
      (click)="seleccionar()">
      Seleccionar
    </button>

</section>
</article>
