<div class="scanner-container">

  <h1>Lector QR y códigos de barras</h1>

  <p class="descripcion">
    Presiona el botón para activar la cámara
  </p>

  <button
    class="scan-button"
    (click)="escanear()"
    [disabled]="escaneando">

    {{ escaneando ? 'Escaneando...' : 'Escanear código' }}

  </button>

  @if (resultado) {
    <div class="resultado">

      <h2>Resultado</h2>

      <p class="codigo">
        {{ resultado }}
      </p>

      <p class="tipo">
        Tipo: {{ tipo }}
      </p>

    </div>
  }

</div>
